# your projects
projects:
  # Case Studies (tags: "case-study")
  - name: Reimagining Upload & Apply - Monster and Zety
    summary: "Led the AI generation workstream for a ground-up redesign of the resume upload & apply experience across Monster and Zety. Architected 12 net-new AI-first APIs delivered ahead of schedule, directed platform-wide model migration through structured multi-provider evaluation, and standardized prompt architecture across teams."
    tags: ["case-study", "ai", "platform", "apis"]
    url: "/case-studies/upload-apply-redesign"

  - name: AI Content Platform - Product Area Ownership
    summary: "Own and scaled a 20-API platform serving 35-40 global portals with $10M+ annual revenue. Designed prompt architecture framework, launched resume personalization and job title recommendation from 0-to-1, established multi-LLM evaluation process. Grew platform revenue 2.5x through systematic experimentation achieving >3% average conversion lift."
    tags: ["case-study", "ai", "platform", "apis"]

  - name: Work Assistant — Personal Chief-of-Staff Agent
    summary: "Built for myself; packaged as a forkable template. A multi-source agent that collapses duplicated work signals into one prioritized picture — and runs a second pass to find what should be there but isn't."
    tags: ["case-study", "ai", "agent", "personal"]
    url: "/case-studies/work-assistant"

  - name: Drop/Refund Reduction - Data Programs
    summary: "Led data-driven intervention strategy across Data Science/Analyst bootcamps serving 1,000+ students. Redesigned onboarding, implemented predictive early-warning system, improved pacing through cohort analysis. Reduced drop/refund rate QoQ and increased NPS by 1.5 points."
    tags: ["case-study", "edtech", "data-analysis"]
    url: "/case-studies/drop-refund"

  - name: Internal Ranking Platform – Chill Subs
    summary: "Python pipelines + unified ranking → faster editorial decisions."
    tags: ["case-study", "data-platform", "python"]

