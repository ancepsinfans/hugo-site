# section information
section:
  name: Projects
  id: projects
  enable: true
  weight: 4
  showOnNavbar: true
  # Can optionally hide the title in sections
  # hideTitle: true

# filter buttons
buttons:
  - name: Case Studies
    filter: case-study
  - name: All
    filter: all
# your projects
projects:
  # Case Studies (tags: "case-study")
  - name: AI Content Platform - Product Area Ownership
    summary: "Built and scaled 8-API platform serving 35-40 global portals with $10M+ annual revenue. Designed prompt architecture framework, launched resume personalization and job title recommendation from 0-to-1, established multi-LLM evaluation process. Grew platform revenue 2.5x through systematic experimentation achieving >3% average conversion lift."
    tags: ["case-study", "ai", "platform", "apis"]
    url: "/case-studies/ai-content-platform"

  - name: Drop/Refund Reduction - Data Programs
    summary: "Led data-driven intervention strategy across Data Science/Analyst bootcamps serving 1,000+ students. Redesigned onboarding, implemented predictive early-warning system, improved pacing through cohort analysis. Reduced drop/refund rate QoQ and increased NPS by 1.5 points."
    tags: ["case-study", "edtech", "data-analysis"]
    url: "/case-studies/drop-refund"

  - name: Internal Ranking Platform – Chill Subs
    summary: "Python pipelines + unified ranking → faster editorial decisions."
    tags: ["case-study", "data-platform", "python"]
    url: "/case-studies/ranking-platform"

  # Supporting Projects
  - name: Student Reports Pipeline
    summary: "Automated weekly student reports with privacy-first React dashboard."
    tags: ["data-analysis", "react", "python"]
    url: "https://student-reports.vercel.app/..."

  - name: LLM Chatbot – TripleTen Discord
    summary: "Llama2 + vectorized knowledge base for real-time student support."
    tags: ["chatbot", "llm", "edtech"]

  - name: Content Knowledge Base
    summary: "Student curriculum review site + environment setup guides."
    tags: ["gatsby", "react", "edtech"]

  - name: Skills Graph
    summary: "Student soft/hard skills tracking and visualization system."
    tags: ["mongodb", "nextjs", "edtech"]

  # Personality Flex
  - name: Personal Homelab
    summary: "Self-hosting genealogy, photos, Home Assistant on Minisforum MS-01."
    tags: ["hobby", "homelab", "self-hosting"]

  - name: School Prototype
    summary: "EdTech MVP: learning paths, quizzes, population analytics."
    tags: ["edtech", "mongodb", "nextjs"]

  - name: Congressional Speech Analysis
    summary: "NLP: Predict Congress member age from speech patterns; partisan sentiment."
    tags: ["hobby", "python", "nlp"]





