section:
  name: About # Title of section (default: "")
  id: about # url id/slug of section *Required*
  enable: true # Boolean to determine if this section is enabled (default: false)
  weight: 1 # Order to display section in (default: alphabetical followed by weight)
  showOnNavbar: false # Boolean to determine if a link should be shown for this section on the navbar
  template: sections/about.html #

# your designation
designation: Product Manager, AI Content Platform
# your company information
company:
  name: BOLD
  url: "https://www.bold.com"

resume: "files/resume.pdf"

# a summary about you
summary: |
  Product manager building AI-powered platforms that scale globally.
  
  I own a $10M+ AI content platform at BOLD serving 35-40 resume/cover letter portals across 15+ languages. I design prompt architectures, lead multi-LLM evaluation, and drive product strategy from vision to execution. My work combines deep technical knowledge (API design, prompt engineering, evaluation frameworks) with business impact (2.5x revenue growth, >3% conversion lift, 40% defect reduction).
  
  Previously led data education programs at TripleTen (Yandex), and spent 10 years teaching English in Russia—experience that informs my user-centered approach to complex product problems. I build systems where none exist, lead through influence, and deliver measurable results in ambiguous environments.

