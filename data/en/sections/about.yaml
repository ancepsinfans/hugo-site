summary: |
  Product manager building AI-powered platforms that scale globally.

  I own a $10M+ AI content platform at BOLD — 20 production APIs serving 35+ resume/cover letter portals across 15+ languages. Most recently I led the AI generation workstream for a ground-up redesign of the resume upload & apply experience on Monster and Zety, architecting 12 net-new AI-first APIs and shipping ahead of schedule. I'm focused on AI-native product surfaces where user context management determines output quality.

  Previously led data education programs at TripleTen (Yandex), and spent 10 years teaching English in Russia—experience that informs my user-centered approach to complex product problems. I build systems where none exist, lead through influence, and deliver measurable results in ambiguous environments.

