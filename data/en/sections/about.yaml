section:
  name: About # Title of section (default: "")
  id: about # url id/slug of section *Required*
  enable: true # Boolean to determine if this section is enabled (default: false)
  weight: 1 # Order to display section in (default: alphabetical followed by weight)
  showOnNavbar: false # Boolean to determine if a link should be shown for this section on the navbar
  template: sections/about.html #

# your designation
designation: Product Manager II, AI & Content
# your company information
company:
  name: BOLD
  url: "https://www.bold.com"

resume: "files/resume.pdf"

# a summary about you
summary: |
  Product manager building AI-powered learning and content tools.
  
  I’ve spent 6+ years leading product for AI writing tools, data education bootcamps, and internal data platforms—after 10 years teaching English and studying psychology. 
  Recently, I shipped three generative-AI content solutions that lifted conversion by over 3% and added $6M+ in annualized revenue. I combine deep technical knowledge with user-centered design to move key metrics.

